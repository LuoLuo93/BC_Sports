# 生产环境配置（覆盖 application.yml 中的默认值）
server:
  port: 9091
  servlet:
    context-path: /bcsports

spring:
  datasource:
    # 主库切换: 174 BCSports -> 177 ORCL(bc_sports)
    url: jdbc:oracle:thin:@192.168.5.177:1521:orcl
    username: bc_sports
    password: 123456
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      phy-timeout-millis: 1800000
      validation-query: SELECT 1 FROM DUAL
      validation-query-timeout: 5
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      keep-alive: true
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      use-global-data-source-stat: true
    # 伯俊ERP Oracle 数据源（生产环境 - SID方式连接）
    # 注意：orcl 是 SID 不是服务名，URL用冒号格式 jdbc:oracle:thin:@host:port:sid
    bjerp:
      url: jdbc:oracle:thin:@10.0.1.22:1521:orcl
      username: bosnds3
      password: abc123
    # BI 数仓 Oracle 数据源（生产环境，SID 方式连接）
    bidw:
      url: jdbc:oracle:thin:@192.168.5.177:1521:orcl
      username: ${BIDW_DB_USERNAME:bi_dw}
      password: ${BIDW_DB_PASSWORD:123456}
    # BC_SPORTS 业务表 Oracle 数据源（生产环境，SID 方式连接）
    bcsp:
      url: jdbc:oracle:thin:@192.168.5.177:1521:orcl
      username: ${BCSP_DB_USERNAME:bc_sports}
      password: ${BCSP_DB_PASSWORD:123456}

# 生产环境日志级别
logging:
  level:
    com.bcsport.admin: INFO
    com.bcsport.admin.mapper: WARN
    org.springframework: WARN
    org.apache.shiro: WARN

# 生产环境上传路径（必须在项目外部，避免重新部署时文件丢失）
bc.upload.path: D:/B.C.Sports/uploads

# 伯俊ERP HTTP OpenAPI（生产环境）- 人员同步用，账号密码与测试环境相同
bjerp:
  api-url: http://bos.bc-sports.com.cn:8876/servlets/binserv/Rest
  app-key: ${BJERP_APP_KEY:bcapitest@northland-pro.com.cn}
  app-secret: ${BJERP_APP_SECRET:northland2047.}

# 贴纸打印 Agent 共享密钥：生产环境通过环境变量 AGENT_API_KEY 注入，不在仓库存明文
agent:
  api-key: ${AGENT_API_KEY:}
