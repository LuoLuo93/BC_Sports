      phy-timeout-millis: 1800000
      validation-query: SELECT 1
      validation-query-timeout: 5
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      keep-alive: true
      pool-prepared-statements: false
      filters: stat,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      break-after-acquire-failure: false
      connection-error-retry-attempts: 3
      time-between-connect-error-millis: 30000
    # 伯俊ERP Oracle 数据源
    bjerp:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: oracle.jdbc.OracleDriver
      url: 'jdbc:oracle:thin:@//${BJERP_DB_HOST:192.168.5.174}:${BJERP_DB_PORT:1521}/${BJERP_DB_SERVICE:orcl}?oracle.net.CONNECT_TIMEOUT=10000&oracle.jdbc.ReadTimeout=600000'
      username: ${BJERP_DB_USERNAME:bosnds3}
