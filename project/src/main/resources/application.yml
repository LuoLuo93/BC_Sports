server:
  port: 8080
  servlet:
    context-path: /bcsports
  tomcat:
    max-threads: 200
    min-spare-threads: 20
    max-connections: 8192
    accept-count: 100

# 贴纸打印 Agent 共享密钥（C# 客户端通过 X-API-Key 请求头携带）。
# 默认 local-dev-key 便于本地联调；生产环境用环境变量 AGENT_API_KEY 覆盖，不在仓库存明文。
agent:
  api-key: ${AGENT_API_KEY:local-dev-key}
  task:
    # 卡住判定动态阈值 = stuck-base-minutes + printQty × stuck-minutes-per-qty
    # per-qty=0.05(3秒/张)：1张≈3分，100张≈8分，1000张≈53分。
    # 注意：该阈值只在 auto-redispatch=true 时参与"卡住重派"判定(当前已关闭，阈值休眠)；
    # 若恢复自动重派，按实际打印速度调参——per-qty 必须大于单张实际耗时，否则大数量任务
    # 会在正常打印中途被误判卡住而重派，耗材恢复后同一任务打两遍。
    stuck-base-minutes: ${AGENT_TASK_STUCK_BASE_MINUTES:3}
    stuck-minutes-per-qty: ${AGENT_TASK_STUCK_MINUTES_PER_QTY:0.05}
    # 单个任务最大重派次数，超过则标记失败不再下发
    max-redispatch: ${AGENT_TASK_MAX_REDISPATCH:3}
    # 在途任务上限：该 Agent 未回报(status=1)任务数达到此值后不再派发新任务。
    # Agent 串行打印边打边拉，不限量时大批量任务在本地队列排队、排队时间计入卡住阈值，
    # 会被误判卡住而自动重派导致重复打印。=1 时派发节奏严格对齐串行打印(推荐)；
    # 调大可减少任务间交接空隙，但小任务排在大任务后仍可能触发误重派(Agent 端去重兜底)。
    max-inflight: ${AGENT_TASK_MAX_INFLIGHT:1}
    # 超时自动重派(卡住救援)开关。false=转人工模式：疑似卡住的任务不自动重派也不标失败，
    # 由人工在 Agent 监控里取消/补打/强制重发恢复。
    # 换纸/换碳带时打印队列挂起属正常等待，自动重派会在耗材恢复后把同一任务打两遍；
    # 低并发+有人值守的场景建议关闭(false)，无人值守场景可改回 true。
    auto-redispatch: ${AGENT_TASK_AUTO_REDISPATCH:false}

spring:
  application:
    name: bc-sports-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  devtools:
    restart:
      enabled: false
  # 数据源配置
  # 注意: 池参数必须平铺在各数据源节点下(与 url 同级)才能绑定到 DruidDataSource;
  #       旧的 druid: 子树写法对自建 DataSource Bean 无效(2026-08-17 修正,
  #       当时线上 6 个池实际全部运行在 Druid 默认值 maxActive=8/maxWait=-1)。
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: oracle.jdbc.OracleDriver
    # URL 尾参: 连接建立超时 10s / 读超时 10min(防慢查询永久占用连接和请求线程,
    # 上限需大于最长合法查询耗时, 数仓/同步类 SQL 可能跑到分钟级)
    url: 'jdbc:oracle:thin:@//192.168.104.167:1521/freepdb1?oracle.net.CONNECT_TIMEOUT=10000&oracle.jdbc.ReadTimeout=600000'
    username: ${DB_USERNAME:BC_ERP_MANAGE}
    password: ${DB_PASSWORD:123456}
    initial-size: 5
    min-idle: 5
    max-active: 30
    max-wait: 10000
    time-between-eviction-runs-millis: 60000
    min-evictable-idle-time-millis: 300000
    phy-timeout-millis: 1800000
    validation-query: SELECT 1 FROM DUAL
    validation-query-timeout: 5
    test-while-idle: true
    test-on-borrow: false
    test-on-return: false
    keep-alive: true
    pool-prepared-statements: false
    filters: stat,slf4j
    connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
    # 防止数据库重启后连接池自动关闭
    break-after-acquire-failure: false
    connection-error-retry-attempts: 3
    time-between-connect-error-millis: 30000
    # IHR模块 SQL Server 数据源 (独立库 BC_SPORTS_IHR)
    ihr:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      url: 'jdbc:sqlserver://192.168.5.152:1433;DatabaseName=BC_SPORTS_IHR;encrypt=false;trustServerCertificate=true;socketTimeout=300000;queryTimeout=300000;loginTimeout=60'
      username: ${IHR_DB_USERNAME:sa}
      password: ${IHR_DB_PASSWORD:northland2047.}
      initial-size: 2
      min-idle: 2
      max-active: 15
      max-wait: 10000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      phy-timeout-millis: 1800000
      validation-query: SELECT 1
      validation-query-timeout: 5
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      keep-alive: true
      pool-prepared-statements: false
      filters: stat,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      break-after-acquire-failure: false
      connection-error-retry-attempts: 3
      time-between-connect-error-millis: 30000
    # 企业微信 SQL Server 数据源 (独立库 BC_SPORTS_QYWX)
    qywx:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      url: 'jdbc:sqlserver://192.168.5.152:1433;DatabaseName=BC_SPORTS_QYWX;encrypt=false;trustServerCertificate=true;socketTimeout=300000;queryTimeout=300000;loginTimeout=60'
      username: ${QYWX_DB_USERNAME:sa}
      password: ${QYWX_DB_PASSWORD:northland2047.}
      initial-size: 2
      min-idle: 2
      max-active: 15
      max-wait: 10000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      phy-timeout-millis: 1800000
      validation-query: SELECT 1
      validation-query-timeout: 5
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      keep-alive: true
      pool-prepared-statements: false
      filters: stat,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      break-after-acquire-failure: false
      connection-error-retry-attempts: 3
      time-between-connect-error-millis: 30000
    # 旧版HK ERP SQL Server 数据源 (独立库 HKERP)
    # 源项目 interfaceForHK 直写 Bas_Personnel 等表的链路，与伯俊ERP链路并存
